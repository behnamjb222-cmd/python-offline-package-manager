[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-offline-package-manager"
version = "0.1.0"
description = "POPM - collect, verify, transfer and install Python packages without internet access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.6",
    "packaging>=23.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3", "pyinstaller>=6.6"]

[tool.setuptools.packages.find]
include = ["app*"]
